spring.application.name=sboot3-simple-jpa-auditing

# DATASOURCE
spring.datasource.url=jdbc:mysql://localhost:3306/jpa_audit?useSSL=false
spring.datasource.username=root
spring.datasource.password=

# Hibernate ddl auto update listens for modifications, it
# does not delete existing tables though
# The values: none, create, create-drop, validate, and update
# enable/disable ddl auto creation and update
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=jpa_audit
# esto permite funcionar a flyway aunque la base de datos ya tenga tablas generadas (jpa, a mano, etc)
spring.flyway.baseline-on-migrate=true

# logs
logging.level.root=ERROR
logging.level.org.springframework=INFO
logging.level.org.flywaydb.core=DEBUG
logging.level.com.demo.db=DEBUG



